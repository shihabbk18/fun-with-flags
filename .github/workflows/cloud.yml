name: Verify cloud accounts
on:
  push:
    branches: [main]
    paths: ['cloud/**', 'browser/account*.js', '.github/workflows/cloud.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase tooling
        run: npm ci --prefix cloud --no-audit --no-fund
      - name: Build the Firebase adapter
        run: npm run build --prefix cloud
      - name: Check account queues and privacy
        run: npm test --prefix cloud
      - name: Verify database rules in the local emulator
        working-directory: cloud
        run: npm run test:rules
